services:
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://archcorp:archcorp@postgres:5432/archcorp
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2F
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: archcorp
      POSTGRES_USER: archcorp
      POSTGRES_PASSWORD: archcorp
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U archcorp"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - archcorp-data:/var/lib/postgresql/data
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  archcorp-data:
