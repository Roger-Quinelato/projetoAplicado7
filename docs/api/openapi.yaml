openapi: 3.1.0
info:
  title: Localiza Integração Cenário 4
  description: API demonstrativa para CRM, reservas e contratos, financeiro e faturamento,
    atendimento e assistência 24h, workflow e integração.
  version: 1.0.0
servers:
- url: /
  description: Mesma origem da interface
paths:
  /health/live:
    get:
      tags:
      - Operação
      summary: Live
      description: Informa que o processo está no ar.
      operationId: live
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
      parameters: []
  /health/ready:
    get:
      tags:
      - Operação
      summary: Ready
      description: Informa se o banco responde (503 quando indisponível) e, com RABBITMQ_URL,
        o estado do listener AMQP.
      operationId: ready
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Banco indisponível.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: urn:archcorp:problem:service-unavailable
                title: Dependência indisponível
                status: 503
                detail: Banco indisponível
                instance: /health/ready
                code: SERVICE_UNAVAILABLE
                correlationId: 11111111-1111-4111-8111-111111111111
      parameters: []
  /metrics:
    get:
      tags:
      - Operação
      summary: Metrics
      description: Expõe contadores e latência no formato de texto do Prometheus.
      operationId: metrics
      responses:
        '200':
          description: Contadores e latência no formato de texto do Prometheus, rotulados
            pelo template da rota.
          content:
            text/plain:
              schema:
                type: string
              example: 'archcorp_requests_total{operation="GET_/health/live",status="200"}
                1

                '
        '400':
          description: Cabeçalho de correlação inválido.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: urn:archcorp:problem:bad-request
                title: Requisição inválida
                status: 400
                detail: X-Correlation-ID deve ser UUID
                instance: /api/v1/contracts/drafts
                code: BAD_REQUEST
                correlationId: 11111111-1111-4111-8111-111111111111
        '401':
          description: Token ausente ou inválido.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: urn:archcorp:problem:unauthorized
                title: Não autenticado
                status: 401
                detail: Token ausente ou inválido
                instance: /api/v1/contracts/drafts
                code: UNAUTHORIZED
                correlationId: 11111111-1111-4111-8111-111111111111
        '403':
          description: Papel sem permissão para a operação.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: urn:archcorp:problem:forbidden
                title: Acesso negado
                status: 403
                detail: Papel sem permissão para esta operação
                instance: /api/v1/contracts/drafts
                code: FORBIDDEN
                correlationId: 11111111-1111-4111-8111-111111111111
      security:
      - HTTPBearer: []
      parameters: []
  /api/v1/demo/state:
    get:
      tags:
      - Demonstração
      summary: Demo State
      description: Resume a quantidade de registros de cada módulo.
      operationId: demoState
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoStateResponse'
        '401':
          description: Token ausente ou inválido.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: urn:archcorp:problem:unauthorized
                title: Não autenticado
                status: 401
                detail: Token ausente ou inválido
                instance: /api/v1/demo/state
                code: UNAUTHORIZED
                correlationId: 11111111-1111-4111-8111-111111111111
        '403':
          description: Papel sem permissão para a operação.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: urn:archcorp:problem:forbidden
                title: Acesso negado
                status: 403
                detail: Papel sem permissão para esta operação
                instance: /api/v1/demo/state
                code: FORBIDDEN
                correlationId: 11111111-1111-4111-8111-111111111111
      security:
      - HTTPBearer: []
      parameters:
      - name: X-Correlation-ID
        in: header
        required: false
        description: UUID de correlação. A API gera um UUID quando o cabeçalho é omitido.
        schema:
          type: string
          format: uuid
        example: 11111111-1111-4111-8111-111111111111
  /api/v1/integration/outbox/dispatch:
    post:
      tags:
      - Integração
      summary: Dispatch Outbox
      operationId: dispatchOutbox
      security:
      - HTTPBearer: []
      responses:
        '200':
          description: Resumo do despacho dos eventos pendentes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DispatchResponse'
              example:
                processed: 1
                failed: 0
          headers:
            X-Correlation-ID:
              description: UUID usado para correlacionar a requisição, os logs e os
                eventos.
              schema:
                type: string
                format: uuid
              example: 11111111-1111-4111-8111-111111111111
        '400':
          description: Cabeçalho de correlação inválido.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: urn:archcorp:problem:bad-request
                title: Requisição inválida
                status: 400
                detail: X-Correlation-ID deve ser UUID
                instance: /api/v1/contracts/drafts
                code: BAD_REQUEST
                correlationId: 11111111-1111-4111-8111-111111111111
        '401':
          description: Token ausente ou inválido.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: urn:archcorp:problem:unauthorized
                title: Não autenticado
                status: 401
                detail: Token ausente ou inválido
                instance: /api/v1/contracts/drafts
                code: UNAUTHORIZED
                correlationId: 11111111-1111-4111-8111-111111111111
        '403':
          description: Papel sem permissão para a operação.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: urn:archcorp:problem:forbidden
                title: Acesso negado
                status: 403
                detail: Papel sem permissão para esta operação
                instance: /api/v1/contracts/drafts
                code: FORBIDDEN
                correlationId: 11111111-1111-4111-8111-111111111111
      parameters:
      - name: X-Correlation-ID
        in: header
        required: false
        description: UUID de correlação. A API gera um UUID quando o cabeçalho é omitido.
        schema:
          type: string
          format: uuid
        example: 11111111-1111-4111-8111-111111111111
  /api/v1/integration/failures:
    get:
      tags:
      - Integração
      summary: List Failures
      operationId: listFailures
      security:
      - HTTPBearer: []
      responses:
        '200':
          description: Eventos que atingiram o limite de tentativas.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FailureResponse'
                title: Response Listfailures
              example:
              - eventId: cccccccc-cccc-4ccc-8ccc-cccccccccccc
                eventType: ContractActivated.v1
                attempts: 3
                reason: dependência simulada indisponível
                correlationId: 11111111-1111-4111-8111-111111111111
          headers:
            X-Correlation-ID:
              description: UUID usado para correlacionar a requisição, os logs e os
                eventos.
              schema:
                type: string
                format: uuid
              example: 11111111-1111-4111-8111-111111111111
        '400':
          description: Cabeçalho de correlação inválido.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: urn:archcorp:problem:bad-request
                title: Requisição inválida
                status: 400
                detail: X-Correlation-ID deve ser UUID
                instance: /api/v1/contracts/drafts
                code: BAD_REQUEST
                correlationId: 11111111-1111-4111-8111-111111111111
        '401':
          description: Token ausente ou inválido.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: urn:archcorp:problem:unauthorized
                title: Não autenticado
                status: 401
                detail: Token ausente ou inválido
                instance: /api/v1/contracts/drafts
                code: UNAUTHORIZED
                correlationId: 11111111-1111-4111-8111-111111111111
        '403':
          description: Papel sem permissão para a operação.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: urn:archcorp:problem:forbidden
                title: Acesso negado
                status: 403
                detail: Papel sem permissão para esta operação
                instance: /api/v1/contracts/drafts
                code: FORBIDDEN
                correlationId: 11111111-1111-4111-8111-111111111111
      parameters:
      - name: X-Correlation-ID
        in: header
        required: false
        description: UUID de correlação. A API gera um UUID quando o cabeçalho é omitido.
        schema:
          type: string
          format: uuid
        example: 11111111-1111-4111-8111-111111111111
  /api/v1/integration/failures/{event_id}/reprocess:
    post:
      tags:
      - Integração
      summary: Reprocess
      operationId: reprocess
      security:
      - HTTPBearer: []
      parameters:
      - name: event_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Event Id
      - name: X-Correlation-ID
        in: header
        required: false
        description: UUID de correlação. A API gera um UUID quando o cabeçalho é omitido.
        schema:
          type: string
          format: uuid
        example: 11111111-1111-4111-8111-111111111111
      responses:
        '200':
          description: Evento recolocado em PENDING para novo despacho.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReprocessResponse'
              example:
                eventId: cccccccc-cccc-4ccc-8ccc-cccccccccccc
                status: PENDING
          headers:
            X-Correlation-ID:
              description: UUID usado para correlacionar a requisição, os logs e os
                eventos.
              schema:
                type: string
                format: uuid
              example: 11111111-1111-4111-8111-111111111111
        '400':
          description: Cabeçalho de correlação inválido.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: urn:archcorp:problem:bad-request
                title: Requisição inválida
                status: 400
                detail: X-Correlation-ID deve ser UUID
                instance: /api/v1/contracts/drafts
                code: BAD_REQUEST
                correlationId: 11111111-1111-4111-8111-111111111111
        '401':
          description: Token ausente ou inválido.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: urn:archcorp:problem:unauthorized
                title: Não autenticado
                status: 401
                detail: Token ausente ou inválido
                instance: /api/v1/contracts/drafts
                code: UNAUTHORIZED
                correlationId: 11111111-1111-4111-8111-111111111111
        '403':
          description: Papel sem permissão para a operação.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: urn:archcorp:problem:forbidden
                title: Acesso negado
                status: 403
                detail: Papel sem permissão para esta operação
                instance: /api/v1/contracts/drafts
                code: FORBIDDEN
                correlationId: 11111111-1111-4111-8111-111111111111
        '404':
          description: Evento com falha não encontrado.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: urn:archcorp:problem:not-found
                title: Recurso não encontrado
                status: 404
                detail: Falha não encontrada
                instance: /api/v1/integration/failures/cccccccc-cccc-4ccc-8ccc-cccccccccccc/reprocess
                code: NOT_FOUND
                correlationId: 11111111-1111-4111-8111-111111111111
        '422':
          description: Entrada inválida.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: urn:archcorp:problem:validation-error
                title: Entrada inválida
                status: 422
                detail:
                - &id001
                  type: missing
                  loc:
                  - body
                  - name
                  msg: Field required
                instance: /api/v1/integration/failures/{event_id}/reprocess
                code: VALIDATION_ERROR
                correlationId: 11111111-1111-4111-8111-111111111111
                errors:
                - *id001
  /api/v1/integration/legacy-ids/{source_system}/{legacy_id}:
    get:
      tags:
      - Integração
      summary: Resolve Legacy Id
      operationId: resolveLegacyId
      security:
      - HTTPBearer: []
      parameters:
      - name: source_system
        in: path
        required: true
        schema:
          type: string
          title: Source System
      - name: legacy_id
        in: path
        required: true
        schema:
          type: string
          title: Legacy Id
      - name: X-Correlation-ID
        in: header
        required: false
        description: UUID de correlação. A API gera um UUID quando o cabeçalho é omitido.
        schema:
          type: string
          format: uuid
        example: 11111111-1111-4111-8111-111111111111
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyIdResponse'
        '400':
          description: Cabeçalho de correlação inválido.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: urn:archcorp:problem:bad-request
                title: Requisição inválida
                status: 400
                detail: X-Correlation-ID deve ser UUID
                instance: /api/v1/contracts/drafts
                code: BAD_REQUEST
                correlationId: 11111111-1111-4111-8111-111111111111
        '401':
          description: Token ausente ou inválido.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: urn:archcorp:problem:unauthorized
                title: Não autenticado
                status: 401
                detail: Token ausente ou inválido
                instance: /api/v1/contracts/drafts
                code: UNAUTHORIZED
                correlationId: 11111111-1111-4111-8111-111111111111
        '403':
          description: Papel sem permissão para a operação.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: urn:archcorp:problem:forbidden
                title: Acesso negado
                status: 403
                detail: Papel sem permissão para esta operação
                instance: /api/v1/contracts/drafts
                code: FORBIDDEN
                correlationId: 11111111-1111-4111-8111-111111111111
        '404':
          description: Identificador legado não mapeado.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: urn:archcorp:problem:not-found
                title: Recurso não encontrado
                status: 404
                detail: Identificador legado não encontrado
                instance: /api/v1/integration/legacy-ids/CRM/WEB-LOCALIZA-9999
                code: NOT_FOUND
                correlationId: 11111111-1111-4111-8111-111111111111
        '422':
          description: Entrada inválida.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: urn:archcorp:problem:validation-error
                title: Entrada inválida
                status: 422
                detail:
                - *id001
                instance: /api/v1/integration/legacy-ids/{source_system}/{legacy_id}
                code: VALIDATION_ERROR
                correlationId: 11111111-1111-4111-8111-111111111111
                errors:
                - *id001
  /api/v1/operations/{correlation_id}:
    get:
      tags:
      - Integração
      summary: Operation Trace
      operationId: operationTrace
      security:
      - HTTPBearer: []
      parameters:
      - name: correlation_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Correlation Id
      - name: X-Correlation-ID
        in: header
        required: false
        description: UUID de correlação. A API gera um UUID quando o cabeçalho é omitido.
        schema:
          type: string
          format: uuid
        example: 11111111-1111-4111-8111-111111111111
      responses:
        '200':
          description: Auditoria e eventos vinculados ao correlationId.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationTraceResponse'
              example:
                correlationId: 11111111-1111-4111-8111-111111111111
                audit:
                - occurredAt: '2026-10-01T10:00:00Z'
                  module: contracts
                  operation: activate_contract
                  result: success
                  entityId: bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb
                  details: {}
                events:
                - eventId: cccccccc-cccc-4ccc-8ccc-cccccccccccc
                  eventType: ContractActivated.v1
                  status: PUBLISHED
                  attempts: 0
          headers:
            X-Correlation-ID:
              description: UUID usado para correlacionar a requisição, os logs e os
                eventos.
              schema:
                type: string
                format: uuid
              example: 11111111-1111-4111-8111-111111111111
        '400':
          description: Cabeçalho de correlação inválido.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: urn:archcorp:problem:bad-request
                title: Requisição inválida
                status: 400
                detail: X-Correlation-ID deve ser UUID
                instance: /api/v1/contracts/drafts
                code: BAD_REQUEST
                correlationId: 11111111-1111-4111-8111-111111111111
        '401':
          description: Token ausente ou inválido.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: urn:archcorp:problem:unauthorized
                title: Não autenticado
                status: 401
                detail: Token ausente ou inválido
                instance: /api/v1/contracts/drafts
                code: UNAUTHORIZED
                correlationId: 11111111-1111-4111-8111-111111111111
        '403':
          description: Papel sem permissão para a operação.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: urn:archcorp:problem:forbidden
                title: Acesso negado
                status: 403
                detail: Papel sem permissão para esta operação
                instance: /api/v1/contracts/drafts
                code: FORBIDDEN
                correlationId: 11111111-1111-4111-8111-111111111111
        '404':
          description: Recurso não encontrado.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: urn:archcorp:problem:not-found
                title: Recurso não encontrado
                status: 404
                detail: Recurso não encontrado
                instance: /api/v1/operations/{correlation_id}
                code: NOT_FOUND
                correlationId: 11111111-1111-4111-8111-111111111111
        '422':
          description: Entrada inválida.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: urn:archcorp:problem:validation-error
                title: Entrada inválida
                status: 422
                detail:
                - *id001
                instance: /api/v1/operations/{correlation_id}
                code: VALIDATION_ERROR
                correlationId: 11111111-1111-4111-8111-111111111111
                errors:
                - *id001
  /api/v1/crm/customers:
    post:
      tags:
      - CRM
      summary: Create Customer
      description: Cadastra cliente com identificador global e, opcionalmente, o identificador
        legado do CRM.
      operationId: createCustomer
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerCreate'
      responses:
        '201':
          description: Cliente criado no CRM com identificador global.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
              example:
                customerId: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa
                name: Cliente Frota Localiza Ltda.
                email: gestor.frota@cliente-sintetico.example.com
                eligible: true
                consentService: true
                active: true
                legacyId: WEB-LOCALIZA-1001
        '401':
          description: Token ausente ou inválido.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: urn:archcorp:problem:unauthorized
                title: Não autenticado
                status: 401
                detail: Token ausente ou inválido
                instance: /api/v1/crm/customers
                code: UNAUTHORIZED
                correlationId: 11111111-1111-4111-8111-111111111111
        '403':
          description: Papel sem permissão para a operação.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: urn:archcorp:problem:forbidden
                title: Acesso negado
                status: 403
                detail: Papel sem permissão para esta operação
                instance: /api/v1/crm/customers
                code: FORBIDDEN
                correlationId: 11111111-1111-4111-8111-111111111111
        '409':
          description: E-mail ou identificador legado já cadastrado.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: urn:archcorp:problem:conflict
                title: Conflito
                status: 409
                detail: E-mail ou identificador legado já cadastrado
                instance: /api/v1/crm/customers
                code: CONFLICT
                correlationId: 11111111-1111-4111-8111-111111111111
        '422':
          description: Entrada inválida.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: urn:archcorp:problem:validation-error
                title: Entrada inválida
                status: 422
                detail:
                - *id001
                instance: /api/v1/crm/customers
                code: VALIDATION_ERROR
                correlationId: 11111111-1111-4111-8111-111111111111
                errors:
                - *id001
      parameters:
      - name: X-Correlation-ID
        in: header
        required: false
        description: UUID de correlação. A API gera um UUID quando o cabeçalho é omitido.
        schema:
          type: string
          format: uuid
        example: 11111111-1111-4111-8111-111111111111
    get:
      tags:
      - CRM
      summary: List Customers
      description: Lista clientes com filtros por e-mail, identificador legado e situação,
        com paginação.
      operationId: listCustomers
      security:
      - HTTPBearer: []
      parameters:
      - name: email
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: email
          - type: 'null'
          title: Email
      - name: legacyId
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 100
          - type: 'null'
          title: Legacyid
      - name: active
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Active
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
