openapi: 3.1.0
info:
  title: Localiza Integração Cenário 4
  description: API demonstrativa para CRM, reservas e contratos, financeiro e faturamento,
    atendimento e assistência 24h, workflow e integração.
  version: 1.0.0
paths:
  /health/live:
    get:
      tags:
      - Operação
      summary: Live
      description: Informa que o processo está no ar.
      operationId: live_health_live_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
      parameters: []
  /health/ready:
    get:
      tags:
      - Operação
      summary: Ready
      description: Informa se o banco responde; 503 quando indisponível.
      operationId: ready_health_ready_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Banco indisponível.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: urn:archcorp:problem:service-unavailable
                title: Dependência indisponível
                status: 503
                detail: Banco indisponível
                instance: /health/ready
                code: SERVICE_UNAVAILABLE
                correlationId: 11111111-1111-4111-8111-111111111111
      parameters: []
  /metrics:
    get:
      tags:
      - Operação
      summary: Metrics
      description: Expõe contadores e latência no formato de texto do Prometheus.
      operationId: metrics_metrics_get
      responses:
        '200':
          description: Contadores e latência no formato de texto do Prometheus.
          content:
            text/plain:
              schema:
                type: string
              example: 'archcorp_requests_total{operation="GET_/health/live",status="200"}
                1

                '
      parameters: []
  /api/v1/contracts/drafts:
    post:
      tags:
      - Reservas e contratos
      summary: Create Contract Draft
      description: Cria rascunho de contrato para cliente elegível; repetir a Idempotency-Key
        devolve a mesma resposta.
      operationId: create_contract_draft_api_v1_contracts_drafts_post
      security:
      - HTTPBearer: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          maxLength: 100
          examples:
          - demo-contract-001
          title: Idempotency-Key
      - name: X-Correlation-ID
        in: header
        required: false
        description: UUID de correlação. A API gera um UUID quando o cabeçalho é omitido.
        schema:
          type: string
          format: uuid
        example: 11111111-1111-4111-8111-111111111111
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContractDraftCreate'
      responses:
        '201':
          description: Rascunho criado ou resposta idempotente recuperada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractDraftResponse'
              examples:
                created:
                  summary: Rascunho criado
                  value:
                    contractId: bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb
                    customerId: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa
                    serviceCode: RENTAL-FLEX
                    startsOn: '2026-10-01'
                    billing:
                      amount: 2500.0
                      currency: BRL
                      cycle: MONTHLY
                    slaHours: 8
                    status: DRAFT
                replayed:
                  summary: Resposta recuperada com Idempotency-Replayed true
                  value:
                    contractId: bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb
                    customerId: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa
                    serviceCode: RENTAL-FLEX
                    startsOn: '2026-10-01'
                    billing:
                      amount: 2500.0
                      currency: BRL
                      cycle: MONTHLY
                    slaHours: 8
                    status: DRAFT
          headers:
            X-Correlation-ID:
              description: UUID usado para correlacionar a requisição, os logs e os
                eventos.
              schema:
                type: string
                format: uuid
              example: 11111111-1111-4111-8111-111111111111
            Idempotency-Replayed:
              description: Retorna true quando a API reutiliza a resposta armazenada.
              schema:
                type: string
                enum:
                - 'true'
                - 'false'
              example: 'false'
        '400':
          description: Cabeçalho de correlação inválido.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: urn:archcorp:problem:bad-request
                title: Requisição inválida
                status: 400
                detail: X-Correlation-ID deve ser UUID
                instance: /api/v1/contracts/drafts
                code: BAD_REQUEST
                correlationId: 11111111-1111-4111-8111-111111111111
        '401':
          description: Token ausente ou inválido.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: urn:archcorp:problem:unauthorized
                title: Não autenticado
                status: 401
                detail: Token ausente ou inválido
                instance: /api/v1/contracts/drafts
                code: UNAUTHORIZED
                correlationId: 11111111-1111-4111-8111-111111111111
        '403':
          description: Papel sem permissão para a operação.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: urn:archcorp:problem:forbidden
                title: Acesso negado
                status: 403
                detail: Papel sem permissão para esta operação
                instance: /api/v1/contracts/drafts
                code: FORBIDDEN
                correlationId: 11111111-1111-4111-8111-111111111111
        '409':
          description: Idempotency-Key reutilizada com outro conteúdo ou contrato
            já existente.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: urn:archcorp:problem:idempotency-conflict
                title: Conflito
                status: 409
                detail: Idempotency-Key já utilizada com outro contrato
                instance: /api/v1/contracts/drafts
                code: IDEMPOTENCY_CONFLICT
                correlationId: 11111111-1111-4111-8111-111111111111
        '422':
          description: Entrada inválida ou cliente inexistente, inelegível ou sem
            consentimento.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                businessRule:
                  summary: Cliente não pode originar contrato
                  value:
                    type: urn:archcorp:problem:business-rule-violation
                    title: Entrada inválida
                    status: 422
                    detail: Cliente inexistente ou inelegível
                    instance: /api/v1/contracts/drafts
                    code: BUSINESS_RULE_VIOLATION
                    correlationId: 11111111-1111-4111-8111-111111111111
                validation:
                  summary: Corpo da requisição inválido
                  value:
                    type: urn:archcorp:problem:validation-error
                    title: Entrada inválida
                    status: 422
                    detail:
                    - type: uuid_parsing
                      loc:
                      - body
                      - customerId
                      msg: Input should be a valid UUID
                      input: not-a-uuid
                    instance: /api/v1/contracts/drafts
                    code: VALIDATION_ERROR
                    correlationId: 11111111-1111-4111-8111-111111111111
                    errors:
                    - type: uuid_parsing
                      loc:
                      - body
                      - customerId
                      msg: Input should be a valid UUID
                      input: not-a-uuid
  /api/v1/contracts/{contract_id}/activate:
    post:
      tags:
      - Reservas e contratos
      summary: Activate Contract
      description: Ativa o contrato e grava ContractActivated.v1, que gera cobrança
        e preparação de retirada.
      operationId: activate_contract_api_v1_contracts__contract_id__activate_post
      security:
      - HTTPBearer: []
      parameters:
      - name: contract_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Contract Id
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          maxLength: 100
          examples:
          - demo-activate-001
          title: Idempotency-Key
      - name: X-Correlation-ID
        in: header
        required: false
        description: UUID de correlação. A API gera um UUID quando o cabeçalho é omitido.
        schema:
          type: string
          format: uuid
        example: 11111111-1111-4111-8111-111111111111
      responses:
        '200':
          description: Contrato ativado ou resposta idempotente recuperada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractActivationResponse'
              examples:
                activated:
                  summary: Contrato ativado e evento gravado na outbox
                  value:
                    contractId: bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb
                    customerId: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa
                    serviceCode: RENTAL-FLEX
                    startsOn: '2026-10-01'
                    billing:
                      amount: 2500.0
                      currency: BRL
                      cycle: MONTHLY
                    slaHours: 8
                    status: ACTIVE
                    eventId: cccccccc-cccc-4ccc-8ccc-cccccccccccc
                replayed:
                  summary: Resposta recuperada com Idempotency-Replayed true
                  value:
                    contractId: bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb
                    customerId: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa
                    serviceCode: RENTAL-FLEX
                    startsOn: '2026-10-01'
                    billing:
                      amount: 2500.0
                      currency: BRL
                      cycle: MONTHLY
                    slaHours: 8
                    status: ACTIVE
                    eventId: cccccccc-cccc-4ccc-8ccc-cccccccccccc
          headers:
            X-Correlation-ID:
              description: UUID usado para correlacionar a requisição, os logs e os
                eventos.
              schema:
                type: string
                format: uuid
              example: 11111111-1111-4111-8111-111111111111
            Idempotency-Replayed:
              description: Retorna true quando a API reutiliza a resposta armazenada.
              schema:
                type: string
                enum:
                - 'true'
                - 'false'
              example: 'false'
        '400':
          description: Cabeçalho de correlação inválido.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: urn:archcorp:problem:bad-request
                title: Requisição inválida
                status: 400
                detail: X-Correlation-ID deve ser UUID
                instance: /api/v1/contracts/drafts
                code: BAD_REQUEST
                correlationId: 11111111-1111-4111-8111-111111111111
        '401':
          description: Token ausente ou inválido.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: urn:archcorp:problem:unauthorized
                title: Não autenticado
                status: 401
                detail: Token ausente ou inválido
                instance: /api/v1/contracts/drafts
                code: UNAUTHORIZED
                correlationId: 11111111-1111-4111-8111-111111111111
        '403':
          description: Papel sem permissão para a operação.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: urn:archcorp:problem:forbidden
                title: Acesso negado
                status: 403
                detail: Papel sem permissão para esta operação
                instance: /api/v1/contracts/drafts
                code: FORBIDDEN
                correlationId: 11111111-1111-4111-8111-111111111111
        '404':
          description: Contrato não encontrado.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: urn:archcorp:problem:not-found
                title: Recurso não encontrado
                status: 404
                detail: Contrato não encontrado
                instance: /api/v1/contracts/bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb/activate
                code: NOT_FOUND
                correlationId: 11111111-1111-4111-8111-111111111111
        '409':
          description: Contrato já encerrado ou estado incompatível para ativação.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: urn:archcorp:problem:invalid-state
                title: Conflito
                status: 409
                detail: Somente contrato em rascunho pode ser ativado
                instance: /api/v1/contracts/bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb/activate
                code: INVALID_STATE
                correlationId: 11111111-1111-4111-8111-111111111111
        '422':
          description: Entrada inválida.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: urn:archcorp:problem:validation-error
                title: Entrada inválida
                status: 422
                detail:
                - &id001
                  type: missing
                  loc:
                  - body
                  - name
                  msg: Field required
                  input: {}
                instance: /api/v1/contracts/{contract_id}/activate
                code: VALIDATION_ERROR
                correlationId: 11111111-1111-4111-8111-111111111111
                errors:
                - *id001
  /api/v1/contracts/{contract_id}/entitlement:
    get:
      tags:
      - Reservas e contratos
      summary: Entitlement
      description: Consulta se o contrato ativo cobre cliente e serviço e qual o SLA.
      operationId: entitlement_api_v1_contracts__contract_id__entitlement_get
      security:
      - HTTPBearer: []
      parameters:
      - name: contract_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Contract Id
      - name: customerId
        in: query
        required: true
        schema:
          type: string
          format: uuid
          title: Customerid
      - name: serviceCode
        in: query
        required: true
        schema:
          type: string
          title: Servicecode
      - name: X-Correlation-ID
        in: header
        required: false
        description: UUID de correlação. A API gera um UUID quando o cabeçalho é omitido.
        schema:
          type: string
          format: uuid
        example: 11111111-1111-4111-8111-111111111111
      responses:
        '200':
          description: Elegibilidade e SLA do contrato.
          content:
            application/json:
