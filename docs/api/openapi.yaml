                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/operations/{correlation_id}:
    get:
      tags:
      - Integração
      summary: Operation Trace
      operationId: operation_trace_api_v1_operations__correlation_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: correlation_id
        in: path
        required: true
        schema:
          type: string
          title: Correlation Id
      - name: X-Correlation-ID
        in: header
        required: false
        description: UUID de correlação. A API gera um UUID quando o cabeçalho é omitido.
        schema:
          type: string
          format: uuid
        example: 11111111-1111-4111-8111-111111111111
      responses:
        '200':
          description: Auditoria e eventos vinculados ao correlationId.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Operation Trace Api V1 Operations  Correlation Id  Get
              example:
                correlationId: 11111111-1111-4111-8111-111111111111
                audit:
                - occurredAt: '2026-10-01T10:00:00Z'
                  module: contracts
                  operation: activate_contract
                  result: success
                  entityId: bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb
                  details: {}
                events:
                - eventId: cccccccc-cccc-4ccc-8ccc-cccccccccccc
                  eventType: ContractActivated.v1
                  status: PUBLISHED
                  attempts: 0
          headers:
            X-Correlation-ID:
              description: UUID usado para correlacionar a requisição, os logs e os
                eventos.
              schema:
                type: string
                format: uuid
              example: 11111111-1111-4111-8111-111111111111
        '400':
          description: Cabeçalho de correlação inválido.
          content:
            application/json:
              example:
                detail: X-Correlation-ID deve ser UUID
        '401':
          description: Token ausente ou inválido.
          content:
            application/json:
              example:
                detail: Token ausente ou inválido
        '403':
          description: Papel sem permissão para a operação.
          content:
            application/json:
              example:
                detail: Papel sem permissão para esta operação
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/demo/state:
    get:
      tags:
      - Demonstração
      summary: Demo State
      operationId: demo_state_api_v1_demo_state_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Demo State Api V1 Demo State Get
      security:
      - HTTPBearer: []
components:
  schemas:
    Billing:
