openapi: 3.1.0
info:
  title: Localiza Integração Cenário 4
  description: API demonstrativa para CRM, reservas e contratos, financeiro e faturamento,
    atendimento e assistência 24h, workflow e integração.
  version: 1.0.0
paths:
  /health/live:
    get:
      tags:
      - Operação
      summary: Live
      operationId: live_health_live_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Live Health Live Get
  /health/ready:
    get:
      tags:
      - Operação
      summary: Ready
      operationId: ready_health_ready_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Ready Health Ready Get
  /metrics:
    get:
      tags:
      - Operação
      summary: Metrics
      operationId: metrics_metrics_get
      responses:
        '200':
          description: Successful Response
          content:
            text/plain:
              schema:
                type: string
  /api/v1/crm/customers:
    post:
      tags:
      - CRM
      summary: Create Customer
      operationId: create_customer_api_v1_crm_customers_post
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerCreate'
      responses:
        '201':
          description: Cliente criado no CRM com identificador global.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
              example:
                customerId: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa
                name: Cliente Frota Localiza Ltda.
                email: gestor.frota@cliente-sintetico.example.com
                eligible: true
                consentService: true
                legacyId: WEB-LOCALIZA-1001
          headers:
            X-Correlation-ID:
              description: UUID usado para correlacionar a requisição, os logs e os
                eventos.
              schema:
                type: string
                format: uuid
              example: 11111111-1111-4111-8111-111111111111
        '400':
          description: Cabeçalho de correlação inválido.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: urn:archcorp:problem:bad-request
                title: Requisição inválida
                status: 400
                detail: X-Correlation-ID deve ser UUID
                instance: /api/v1/contracts/drafts
                code: BAD_REQUEST
                correlationId: 11111111-1111-4111-8111-111111111111
        '401':
          description: Token ausente ou inválido.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: urn:archcorp:problem:unauthorized
                title: Não autenticado
                status: 401
                detail: Token ausente ou inválido
                instance: /api/v1/contracts/drafts
                code: UNAUTHORIZED
                correlationId: 11111111-1111-4111-8111-111111111111
        '403':
          description: Papel sem permissão para a operação.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: urn:archcorp:problem:forbidden
                title: Acesso negado
                status: 403
                detail: Papel sem permissão para esta operação
                instance: /api/v1/contracts/drafts
                code: FORBIDDEN
                correlationId: 11111111-1111-4111-8111-111111111111
        '422':
          description: Entrada inválida.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: urn:archcorp:problem:validation-error
                title: Entrada inválida
                status: 422
                detail:
                - &id001
                  type: missing
                  loc:
                  - body
                  - name
                  msg: Field required
                  input: {}
                instance: /api/v1/crm/customers
                code: VALIDATION_ERROR
                correlationId: 11111111-1111-4111-8111-111111111111
                errors:
                - *id001
      parameters:
      - name: X-Correlation-ID
        in: header
        required: false
        description: UUID de correlação. A API gera um UUID quando o cabeçalho é omitido.
        schema:
          type: string
          format: uuid
        example: 11111111-1111-4111-8111-111111111111
    get:
      tags:
      - CRM
      summary: List Customers
      operationId: list_customers_api_v1_crm_customers_get
      security:
      - HTTPBearer: []
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
                title: Response List Customers Api V1 Crm Customers Get
  /api/v1/crm/customers/{customer_id}:
    patch:
      tags:
      - CRM
      summary: Update Customer
      operationId: update_customer_api_v1_crm_customers__customer_id__patch
