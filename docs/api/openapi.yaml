openapi: 3.1.0
info:
  title: ArchCorp Integração Cenário 4
  description: API demonstrativa para CRM, contratos, financeiro, atendimento, workflow
    e integração.
  version: 1.0.0
paths:
  /health/live:
    get:
      tags:
      - Operação
      summary: Live
      operationId: live_health_live_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Live Health Live Get
  /health/ready:
    get:
      tags:
      - Operação
      summary: Ready
      operationId: ready_health_ready_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Ready Health Ready Get
  /metrics:
    get:
      tags:
      - Operação
      summary: Metrics
      operationId: metrics_metrics_get
      responses:
        '200':
          description: Successful Response
          content:
            text/plain:
              schema:
                type: string
  /api/v1/crm/customers:
    post:
      tags:
      - CRM
      summary: Create Customer
      operationId: create_customer_api_v1_crm_customers_post
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerCreate'
      responses:
        '201':
          description: Cliente criado no CRM com identificador global.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Create Customer Api V1 Crm Customers Post
              example:
                customerId: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa
                name: Empresa Exemplo Ltda.
                email: contato@empresa-exemplo.test
                eligible: true
          headers:
            X-Correlation-ID:
              description: UUID usado para correlacionar a requisição, os logs e os
                eventos.
              schema:
                type: string
                format: uuid
              example: 11111111-1111-4111-8111-111111111111
        '400':
          description: Cabeçalho de correlação inválido.
          content:
            application/json:
              example:
                detail: X-Correlation-ID deve ser UUID
        '401':
          description: Token ausente ou inválido.
          content:
            application/json:
              example:
                detail: Token ausente ou inválido
        '403':
          description: Papel sem permissão para a operação.
          content:
            application/json:
              example:
                detail: Papel sem permissão para esta operação
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      parameters:
      - name: X-Correlation-ID
        in: header
        required: false
        description: UUID de correlação. A API gera um UUID quando o cabeçalho é omitido.
        schema:
          type: string
          format: uuid
        example: 11111111-1111-4111-8111-111111111111
  /api/v1/crm/customers/{customer_id}:
    patch:
      tags:
      - CRM
      summary: Update Customer
      operationId: update_customer_api_v1_crm_customers__customer_id__patch
      security:
      - HTTPBearer: []
      parameters:
      - name: customer_id
        in: path
        required: true
        schema:
          type: string
          title: Customer Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Update Customer Api V1 Crm Customers  Customer Id  Patch
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/contracts/drafts:
    post:
      tags:
      - Contratos
      summary: Create Contract Draft
      operationId: create_contract_draft_api_v1_contracts_drafts_post
      security:
      - HTTPBearer: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          examples:
          - demo-contract-001
          title: Idempotency-Key
      - name: X-Correlation-ID
        in: header
        required: false
        description: UUID de correlação. A API gera um UUID quando o cabeçalho é omitido.
        schema:
          type: string
          format: uuid
        example: 11111111-1111-4111-8111-111111111111
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContractDraftCreate'
      responses:
        '201':
          description: Rascunho criado ou resposta idempotente recuperada.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Create Contract Draft Api V1 Contracts Drafts Post
              examples:
                created:
                  summary: Rascunho criado
                  value:
                    contractId: bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb
                    customerId: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa
                    serviceCode: SUPPORT-PREMIUM
                    startsOn: '2026-10-01'
                    billing:
                      amount: 2500.0
                      currency: BRL
                      cycle: MONTHLY
                    slaHours: 8
                    status: DRAFT
                replayed:
                  summary: Resposta recuperada com Idempotency-Replayed true
                  value:
                    contractId: bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb
                    customerId: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa
                    serviceCode: SUPPORT-PREMIUM
                    startsOn: '2026-10-01'
                    billing:
                      amount: 2500.0
                      currency: BRL
                      cycle: MONTHLY
                    slaHours: 8
                    status: DRAFT
          headers:
            X-Correlation-ID:
              description: UUID usado para correlacionar a requisição, os logs e os
                eventos.
              schema:
                type: string
                format: uuid
              example: 11111111-1111-4111-8111-111111111111
            Idempotency-Replayed:
              description: Retorna true quando a API reutiliza a resposta armazenada.
              schema:
                type: string
                enum:
                - 'true'
                - 'false'
              example: 'false'
        '400':
          description: Cabeçalho de correlação inválido.
          content:
            application/json:
              example:
                detail: X-Correlation-ID deve ser UUID
        '401':
          description: Token ausente ou inválido.
          content:
            application/json:
              example:
                detail: Token ausente ou inválido
        '403':
          description: Papel sem permissão para a operação.
          content:
            application/json:
              example:
                detail: Papel sem permissão para esta operação
        '422':
          description: Entrada inválida ou cliente inexistente ou inelegível.
          content:
            application/json:
              example:
                detail: Cliente inexistente ou inelegível
  /api/v1/contracts/{contract_id}/activate:
    post:
      tags:
      - Contratos
      summary: Activate Contract
      operationId: activate_contract_api_v1_contracts__contract_id__activate_post
      security:
      - HTTPBearer: []
      parameters:
      - name: contract_id
        in: path
        required: true
        schema:
          type: string
          title: Contract Id
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          examples:
          - demo-activate-001
          title: Idempotency-Key
      - name: X-Correlation-ID
        in: header
        required: false
        description: UUID de correlação. A API gera um UUID quando o cabeçalho é omitido.
        schema:
          type: string
          format: uuid
        example: 11111111-1111-4111-8111-111111111111
      responses:
        '200':
          description: Contrato ativado ou resposta idempotente recuperada.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Activate Contract Api V1 Contracts  Contract Id  Activate
                  Post
              examples:
                activated:
                  summary: Contrato ativado e evento gravado na outbox
                  value:
                    contractId: bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb
                    customerId: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa
                    serviceCode: SUPPORT-PREMIUM
                    startsOn: '2026-10-01'
                    billing:
                      amount: 2500.0
                      currency: BRL
                      cycle: MONTHLY
                    slaHours: 8
                    status: ACTIVE
                    eventId: cccccccc-cccc-4ccc-8ccc-cccccccccccc
                replayed:
                  summary: Resposta recuperada com Idempotency-Replayed true
                  value:
                    contractId: bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb
                    customerId: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa
                    serviceCode: SUPPORT-PREMIUM
                    startsOn: '2026-10-01'
                    billing:
                      amount: 2500.0
                      currency: BRL
                      cycle: MONTHLY
                    slaHours: 8
                    status: ACTIVE
                    eventId: cccccccc-cccc-4ccc-8ccc-cccccccccccc
          headers:
            X-Correlation-ID:
              description: UUID usado para correlacionar a requisição, os logs e os
                eventos.
              schema:
                type: string
                format: uuid
              example: 11111111-1111-4111-8111-111111111111
            Idempotency-Replayed:
              description: Retorna true quando a API reutiliza a resposta armazenada.
              schema:
                type: string
                enum:
                - 'true'
                - 'false'
              example: 'false'
        '400':
          description: Cabeçalho de correlação inválido.
          content:
            application/json:
              example:
                detail: X-Correlation-ID deve ser UUID
        '401':
          description: Token ausente ou inválido.
          content:
            application/json:
              example:
                detail: Token ausente ou inválido
        '403':
          description: Papel sem permissão para a operação.
          content:
            application/json:
              example:
                detail: Papel sem permissão para esta operação
        '404':
          description: Contrato não encontrado.
          content:
            application/json:
              example:
                detail: Contrato não encontrado
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/contracts/{contract_id}/entitlement:
    get:
      tags:
      - Contratos
      summary: Entitlement
      operationId: entitlement_api_v1_contracts__contract_id__entitlement_get
      security:
      - HTTPBearer: []
      parameters:
      - name: contract_id
        in: path
        required: true
        schema:
          type: string
          title: Contract Id
      - name: customerId
        in: query
        required: true
        schema:
          type: string
          title: Customerid
      - name: serviceCode
        in: query
        required: true
        schema:
          type: string
          title: Servicecode
      - name: X-Correlation-ID
        in: header
        required: false
        description: UUID de correlação. A API gera um UUID quando o cabeçalho é omitido.
        schema:
          type: string
          format: uuid
        example: 11111111-1111-4111-8111-111111111111
      responses:
        '200':
          description: Elegibilidade e SLA do contrato.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Entitlement Api V1 Contracts  Contract Id  Entitlement
                  Get
              examples:
                eligible:
                  summary: Contrato elegível
                  value:
                    eligible: true
                    slaHours: 8
                notEligible:
                  summary: Contrato não elegível
                  value:
                    eligible: false
          headers:
            X-Correlation-ID:
              description: UUID usado para correlacionar a requisição, os logs e os
                eventos.
              schema:
                type: string
                format: uuid
              example: 11111111-1111-4111-8111-111111111111
        '400':
          description: Cabeçalho de correlação inválido.
          content:
            application/json:
              example:
                detail: X-Correlation-ID deve ser UUID
        '401':
          description: Token ausente ou inválido.
          content:
            application/json:
              example:
                detail: Token ausente ou inválido
        '403':
          description: Papel sem permissão para a operação.
          content:
            application/json:
              example:
                detail: Papel sem permissão para esta operação
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/support/tickets:
    post:
      tags:
      - Atendimento
      summary: Open Ticket
      operationId: open_ticket_api_v1_support_tickets_post
      security:
      - HTTPBearer: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          examples:
          - demo-ticket-001
          title: Idempotency-Key
      - name: X-Correlation-ID
        in: header
        required: false
        description: UUID de correlação. A API gera um UUID quando o cabeçalho é omitido.
        schema:
          type: string
          format: uuid
        example: 11111111-1111-4111-8111-111111111111
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketCreate'
      responses:
        '201':
          description: Chamado criado ou resposta idempotente recuperada.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Open Ticket Api V1 Support Tickets Post
              examples:
                open:
                  summary: Chamado elegível aberto
                  value:
                    ticketId: dddddddd-dddd-4ddd-8ddd-dddddddddddd
                    customerId: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa
                    contractId: bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb
                    serviceCode: SUPPORT-PREMIUM
                    category: OUTAGE
                    status: OPEN
                    priority: HIGH
                    slaHours: 8
                    dueAt: '2026-10-01T18:10:00Z'
                pending:
                  summary: Chamado pendente por indisponibilidade de Contracts
                  value:
                    ticketId: dddddddd-dddd-4ddd-8ddd-dddddddddddd
                    customerId: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa
                    contractId: bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb
                    serviceCode: SUPPORT-PREMIUM
                    category: QUESTION
                    status: PENDING_ENTITLEMENT
                    priority: NORMAL
                replayed:
                  summary: Resposta recuperada com Idempotency-Replayed true
                  value:
                    ticketId: dddddddd-dddd-4ddd-8ddd-dddddddddddd
                    customerId: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa
                    contractId: bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb
                    serviceCode: SUPPORT-PREMIUM
                    category: OUTAGE
                    status: OPEN
                    priority: HIGH
                    slaHours: 8
                    dueAt: '2026-10-01T18:10:00Z'
          headers:
            X-Correlation-ID:
              description: UUID usado para correlacionar a requisição, os logs e os
                eventos.
              schema:
                type: string
                format: uuid
              example: 11111111-1111-4111-8111-111111111111
            Idempotency-Replayed:
              description: Retorna true quando a API reutiliza a resposta armazenada.
              schema:
                type: string
                enum:
                - 'true'
                - 'false'
              example: 'false'
        '400':
          description: Cabeçalho de correlação inválido.
          content:
            application/json:
              example:
                detail: X-Correlation-ID deve ser UUID
        '401':
          description: Token ausente ou inválido.
          content:
            application/json:
              example:
                detail: Token ausente ou inválido
        '403':
          description: Papel sem permissão para a operação.
          content:
            application/json:
              example:
                detail: Papel sem permissão para esta operação
        '422':
          description: Entrada inválida ou contrato, serviço ou cliente sem elegibilidade.
          content:
            application/json:
              example:
                detail: Contrato, serviço ou cliente sem elegibilidade
  /api/v1/support/tickets/{ticket_id}/reconcile:
