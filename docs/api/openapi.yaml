  /api/v1/support/tickets:
    post:
      tags:
      - Atendimento e assistência 24h
      summary: Open Ticket
      description: Abre chamado com SLA do contrato; sem Contracts disponível, fica
        pendente de elegibilidade.
      operationId: open_ticket_api_v1_support_tickets_post
      security:
      - HTTPBearer: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          maxLength: 100
          examples:
          - demo-ticket-001
          title: Idempotency-Key
      - name: X-Correlation-ID
        in: header
        required: false
        description: UUID de correlação. A API gera um UUID quando o cabeçalho é omitido.
        schema:
          type: string
          format: uuid
        example: 11111111-1111-4111-8111-111111111111
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketCreate'
      responses:
        '201':
          description: Chamado criado ou resposta idempotente recuperada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketResponse'
              examples:
                open:
                  summary: Chamado elegível aberto
                  value:
                    ticketId: dddddddd-dddd-4ddd-8ddd-dddddddddddd
                    customerId: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa
                    contractId: bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb
                    serviceCode: RENTAL-FLEX
                    category: OUTAGE
                    status: OPEN
                    priority: HIGH
                    slaHours: 8
                    dueAt: '2026-10-01T18:10:00Z'
                pending:
                  summary: Chamado pendente por indisponibilidade de Contracts
                  value:
                    ticketId: dddddddd-dddd-4ddd-8ddd-dddddddddddd
                    customerId: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa
                    contractId: bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb
                    serviceCode: RENTAL-FLEX
                    category: QUESTION
                    status: PENDING_ENTITLEMENT
                    priority: NORMAL
                replayed:
                  summary: Resposta recuperada com Idempotency-Replayed true
                  value:
                    ticketId: dddddddd-dddd-4ddd-8ddd-dddddddddddd
                    customerId: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa
                    contractId: bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb
                    serviceCode: RENTAL-FLEX
                    category: OUTAGE
                    status: OPEN
                    priority: HIGH
                    slaHours: 8
                    dueAt: '2026-10-01T18:10:00Z'
          headers:
            X-Correlation-ID:
              description: UUID usado para correlacionar a requisição, os logs e os
                eventos.
              schema:
                type: string
                format: uuid
              example: 11111111-1111-4111-8111-111111111111
            Idempotency-Replayed:
              description: Retorna true quando a API reutiliza a resposta armazenada.
              schema:
                type: string
                enum:
                - 'true'
                - 'false'
              example: 'false'
        '400':
          description: Cabeçalho de correlação inválido.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: urn:archcorp:problem:bad-request
                title: Requisição inválida
                status: 400
                detail: X-Correlation-ID deve ser UUID
                instance: /api/v1/contracts/drafts
                code: BAD_REQUEST
                correlationId: 11111111-1111-4111-8111-111111111111
        '401':
          description: Token ausente ou inválido.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: urn:archcorp:problem:unauthorized
                title: Não autenticado
                status: 401
                detail: Token ausente ou inválido
                instance: /api/v1/contracts/drafts
                code: UNAUTHORIZED
                correlationId: 11111111-1111-4111-8111-111111111111
        '403':
          description: Papel sem permissão para a operação.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: urn:archcorp:problem:forbidden
                title: Acesso negado
                status: 403
                detail: Papel sem permissão para esta operação
                instance: /api/v1/contracts/drafts
                code: FORBIDDEN
                correlationId: 11111111-1111-4111-8111-111111111111
        '409':
          description: Idempotency-Key reutilizada com outro chamado.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: urn:archcorp:problem:idempotency-conflict
                title: Conflito
                status: 409
                detail: Idempotency-Key já utilizada com outro chamado
                instance: /api/v1/support/tickets
                code: IDEMPOTENCY_CONFLICT
                correlationId: 11111111-1111-4111-8111-111111111111
        '422':
          description: Entrada inválida ou contrato, serviço ou cliente sem elegibilidade.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                businessRule:
                  summary: Contrato sem elegibilidade
                  value:
                    type: urn:archcorp:problem:business-rule-violation
                    title: Entrada inválida
                    status: 422
                    detail: Contrato, serviço ou cliente sem elegibilidade
                    instance: /api/v1/support/tickets
                    code: BUSINESS_RULE_VIOLATION
                    correlationId: 11111111-1111-4111-8111-111111111111
                validation:
                  summary: Corpo da requisição inválido
                  value:
                    type: urn:archcorp:problem:validation-error
                    title: Entrada inválida
                    status: 422
                    detail:
                    - type: uuid_parsing
                      loc:
                      - body
                      - contractId
                      msg: Input should be a valid UUID
                      input: not-a-uuid
                    instance: /api/v1/support/tickets
                    code: VALIDATION_ERROR
                    correlationId: 11111111-1111-4111-8111-111111111111
                    errors:
                    - type: uuid_parsing
                      loc:
                      - body
                      - contractId
                      msg: Input should be a valid UUID
                      input: not-a-uuid
    get:
      tags:
      - Atendimento e assistência 24h
      summary: List Tickets
      description: Lista até 200 chamados.
      operationId: list_tickets_api_v1_support_tickets_get
      security:
      - HTTPBearer: []
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TicketDetailResponse'
                title: Response List Tickets Api V1 Support Tickets Get
        '401':
          description: Token ausente ou inválido.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: urn:archcorp:problem:unauthorized
                title: Não autenticado
                status: 401
                detail: Token ausente ou inválido
                instance: /api/v1/support/tickets
                code: UNAUTHORIZED
                correlationId: 11111111-1111-4111-8111-111111111111
        '403':
          description: Papel sem permissão para a operação.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
