          title: Amount
        currency:
          type: string
          pattern: ^[A-Z]{3}$
          title: Currency
        cycle:
          type: string
          pattern: ^(MONTHLY|QUARTERLY|YEARLY)$
          title: Cycle
      type: object
      required:
      - amount
      - currency
      - cycle
      title: Billing
