      tags:
      - Gestão de processos
      summary: Change Task
      description: Altera estado ou responsável da tarefa e recalcula o processo;
        tarefa concluída ou cancelada é final e repetir o estado e o responsável vigentes
        não tem efeito. O processo é concluído quando todas as tarefas terminam e
        cancelado quando todas são finais com algum cancelamento.
      operationId: changeTask
      security:
      - HTTPBearer: []
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Task Id
      - name: X-Correlation-ID
        in: header
        required: false
        description: UUID de correlação. A API gera um UUID quando o cabeçalho é omitido.
        schema:
          type: string
          format: uuid
        example: 11111111-1111-4111-8111-111111111111
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskChange'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '401':
          description: Token ausente ou inválido.
