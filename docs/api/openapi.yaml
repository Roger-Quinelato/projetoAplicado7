components:
  schemas:
    AssignmentInput:
      properties:
        owner:
          type: string
          maxLength: 80
          minLength: 2
          title: Owner
          description: Equipe ou função responsável; sem e-mail, telefone ou documento.
      type: object
      required:
      - owner
      title: AssignmentInput
      examples:
      - owner: Equipe de assistência
    AuditEntryResponse:
      properties:
        occurredAt:
          type: string
          format: date-time
          title: Occurredat
        module:
          type: string
          title: Module
        operation:
          type: string
          title: Operation
        result:
          type: string
          title: Result
        entityId:
          anyOf:
          - type: string
          - type: 'null'
          title: Entityid
        details:
          additionalProperties: true
          type: object
          title: Details
      type: object
      required:
      - occurredAt
      - module
      - operation
      - result
      - entityId
      - details
      title: AuditEntryResponse
    Billing-Input:
      properties:
        amount:
          anyOf:
          - type: number
            exclusiveMinimum: 0.0
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d{0,2}0*$
          title: Amount
        currency:
          type: string
          pattern: ^[A-Z]{3}$
          title: Currency
        cycle:
          type: string
          pattern: ^(ONCE|MONTHLY|QUARTERLY|YEARLY)$
          title: Cycle
      type: object
      required:
      - amount
      - currency
      - cycle
      title: Billing
    Billing-Output:
      properties:
        amount:
          type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d{0,2}0*$
          title: Amount
        currency:
          type: string
          pattern: ^[A-Z]{3}$
          title: Currency
        cycle:
          type: string
          pattern: ^(ONCE|MONTHLY|QUARTERLY|YEARLY)$
          title: Cycle
      type: object
      required:
      - amount
      - currency
      - cycle
      title: Billing
    BillingResponse:
      properties:
        amount:
          type: number
          title: Amount
        currency:
          type: string
          title: Currency
        cycle:
          type: string
          title: Cycle
      type: object
      required:
      - amount
      - currency
      - cycle
      title: BillingResponse
    ContactInput:
      properties:
        customerId:
          type: string
          format: uuid
          title: Customerid
        name:
          type: string
          maxLength: 150
          minLength: 2
          title: Name
        email:
          type: string
          format: email
          title: Email
        phone:
          anyOf:
          - type: string
            pattern: ^\+[1-9]\d{7,14}$
          - type: 'null'
          title: Phone
          description: Telefone no formato E.164.
      type: object
      required:
      - customerId
      - name
      - email
      title: ContactInput
      examples:
      - customerId: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa
        email: gestora@cliente-sintetico.example.com
        name: Pessoa Gestora Sintética
        phone: '+5531999990000'
    ContactResponse:
      properties:
        contactId:
          type: string
          format: uuid
          title: Contactid
        customerId:
          type: string
          format: uuid
          title: Customerid
        name:
          type: string
          title: Name
        email:
          type: string
          format: email
          title: Email
        phone:
          anyOf:
          - type: string
          - type: 'null'
          title: Phone
      type: object
      required:
      - contactId
      - customerId
      - name
      - email
      - phone
      title: ContactResponse
      examples:
