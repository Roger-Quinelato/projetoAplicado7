  /api/v1/support/tickets:
    post:
      tags:
      - Atendimento e assistência 24h
      summary: Open Ticket
      operationId: open_ticket_api_v1_support_tickets_post
      security:
      - HTTPBearer: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          examples:
          - demo-ticket-001
          title: Idempotency-Key
      - name: X-Correlation-ID
        in: header
        required: false
        description: UUID de correlação. A API gera um UUID quando o cabeçalho é omitido.
        schema:
          type: string
          format: uuid
        example: 11111111-1111-4111-8111-111111111111
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketCreate'
      responses:
        '201':
          description: Chamado criado ou resposta idempotente recuperada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketResponse'
              examples:
                open:
                  summary: Chamado elegível aberto
                  value:
                    ticketId: dddddddd-dddd-4ddd-8ddd-dddddddddddd
                    customerId: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa
                    contractId: bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb
                    serviceCode: RENTAL-FLEX
                    category: OUTAGE
                    status: OPEN
                    priority: HIGH
                    slaHours: 8
                    dueAt: '2026-10-01T18:10:00Z'
                pending:
                  summary: Chamado pendente por indisponibilidade de Contracts
                  value:
                    ticketId: dddddddd-dddd-4ddd-8ddd-dddddddddddd
                    customerId: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa
                    contractId: bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb
                    serviceCode: RENTAL-FLEX
                    category: QUESTION
                    status: PENDING_ENTITLEMENT
                    priority: NORMAL
                replayed:
                  summary: Resposta recuperada com Idempotency-Replayed true
                  value:
                    ticketId: dddddddd-dddd-4ddd-8ddd-dddddddddddd
                    customerId: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa
                    contractId: bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb
                    serviceCode: RENTAL-FLEX
                    category: OUTAGE
                    status: OPEN
                    priority: HIGH
                    slaHours: 8
                    dueAt: '2026-10-01T18:10:00Z'
          headers:
            X-Correlation-ID:
              description: UUID usado para correlacionar a requisição, os logs e os
                eventos.
              schema:
                type: string
                format: uuid
              example: 11111111-1111-4111-8111-111111111111
            Idempotency-Replayed:
              description: Retorna true quando a API reutiliza a resposta armazenada.
              schema:
                type: string
                enum:
                - 'true'
                - 'false'
