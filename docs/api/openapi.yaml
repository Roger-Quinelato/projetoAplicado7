        schema:
          type: string
          format: uuid
        example: 11111111-1111-4111-8111-111111111111
      responses:
        '200':
          description: Chamado reconciliado com a elegibilidade atual.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Reconcile Ticket Api V1 Support Tickets  Ticket Id  Reconcile
                  Post
              examples:
                open:
                  summary: Elegibilidade confirmada
                  value:
                    ticketId: dddddddd-dddd-4ddd-8ddd-dddddddddddd
                    customerId: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa
                    contractId: bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb
                    serviceCode: SUPPORT-PREMIUM
                    category: OUTAGE
                    status: OPEN
                    priority: HIGH
                    slaHours: 8
                    dueAt: '2026-10-01T18:10:00Z'
                rejected:
                  summary: Elegibilidade rejeitada
                  value:
                    ticketId: dddddddd-dddd-4ddd-8ddd-dddddddddddd
                    customerId: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa
                    contractId: bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb
                    serviceCode: SUPPORT-PREMIUM
                    category: QUESTION
                    status: REJECTED_ENTITLEMENT
                    priority: NORMAL
          headers:
            X-Correlation-ID:
              description: UUID usado para correlacionar a requisição, os logs e os
