  /api/v1/support/tickets/{ticket_id}/reconcile:
    post:
      tags:
      - Atendimento e assistência 24h
      summary: Reconcile Ticket
      description: Reconcilia pendência; replay persistido exige a mesma Idempotency-Key.
        Sem chave, preserva os conflitos v1.
      operationId: reconcileTicket
      security:
      - HTTPBearer: []
      parameters:
      - name: ticket_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Ticket Id
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 100
          - type: 'null'
          title: Idempotency-Key
      - name: X-Correlation-ID
        in: header
        required: false
        description: UUID de correlação. A API gera um UUID quando o cabeçalho é omitido.
        schema:
          type: string
          format: uuid
        example: 11111111-1111-4111-8111-111111111111
      responses:
        '200':
          description: Chamado reconciliado, ou resposta original recuperada pela
            mesma Idempotency-Key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketResponse'
              examples:
                open:
                  summary: Elegibilidade confirmada
                  value:
                    ticketId: dddddddd-dddd-4ddd-8ddd-dddddddddddd
                    customerId: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa
                    contractId: bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb
                    serviceCode: RENTAL-FLEX
                    category: OUTAGE
                    status: OPEN
                    priority: HIGH
                    slaHours: 8
                    dueAt: '2026-10-01T18:10:00Z'
                    openedAt: '2026-10-01T10:10:00Z'
                    slaStatus: WITHIN
                rejected:
                  summary: Elegibilidade rejeitada
                  value:
                    ticketId: dddddddd-dddd-4ddd-8ddd-dddddddddddd
                    customerId: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa
                    contractId: bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb
                    serviceCode: RENTAL-FLEX
                    category: QUESTION
                    status: REJECTED_ENTITLEMENT
                    priority: NORMAL
                    openedAt: '2026-10-01T10:10:00Z'
                    slaStatus: NOT_APPLICABLE
          headers:
            X-Correlation-ID:
              description: UUID usado para correlacionar a requisição, os logs e os
                eventos.
              schema:
                type: string
                format: uuid
              example: 11111111-1111-4111-8111-111111111111
            Idempotency-Replayed:
              description: true quando o chamado já havia sido reconciliado e nenhum
                efeito novo foi gravado.
              schema:
                type: string
                enum:
                - 'true'
                - 'false'
              example: 'false'
        '400':
          description: Cabeçalho de correlação inválido.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: urn:archcorp:problem:bad-request
                title: Requisição inválida
                status: 400
                detail: X-Correlation-ID deve ser UUID
                instance: /api/v1/contracts/drafts
                code: BAD_REQUEST
                correlationId: 11111111-1111-4111-8111-111111111111
        '401':
          description: Token ausente ou inválido.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: urn:archcorp:problem:unauthorized
                title: Não autenticado
                status: 401
                detail: Token ausente ou inválido
                instance: /api/v1/contracts/drafts
                code: UNAUTHORIZED
                correlationId: 11111111-1111-4111-8111-111111111111
        '403':
          description: Papel sem permissão para a operação.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: urn:archcorp:problem:forbidden
                title: Acesso negado
                status: 403
                detail: Papel sem permissão para esta operação
                instance: /api/v1/contracts/drafts
                code: FORBIDDEN
                correlationId: 11111111-1111-4111-8111-111111111111
        '404':
          description: Chamado não encontrado.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: urn:archcorp:problem:not-found
                title: Recurso não encontrado
                status: 404
                detail: Chamado não encontrado
                instance: /api/v1/support/tickets/dddddddd-dddd-4ddd-8ddd-dddddddddddd/reconcile
                code: NOT_FOUND
                correlationId: 11111111-1111-4111-8111-111111111111
        '409':
          description: Chamado não está pendente de elegibilidade.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: urn:archcorp:problem:invalid-state
                title: Conflito
                status: 409
                detail: Somente chamado pendente pode ser reconciliado
                instance: /api/v1/support/tickets/dddddddd-dddd-4ddd-8ddd-dddddddddddd/reconcile
                code: INVALID_STATE
                correlationId: 11111111-1111-4111-8111-111111111111
        '422':
          description: Entrada inválida.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: urn:archcorp:problem:validation-error
                title: Entrada inválida
                status: 422
                detail:
                - *id001
                instance: /api/v1/support/tickets/{ticket_id}/reconcile
                code: VALIDATION_ERROR
                correlationId: 11111111-1111-4111-8111-111111111111
                errors:
                - *id001
        '503':
          description: Contracts ainda indisponível; o chamado permanece pendente.
          content:
            application/problem+json:
