    post:
      tags:
      - Financeiro e faturamento
      summary: Record Payment
      description: 'Registra pagamento simulado (sem PSP): valida moeda, saldo e estado
        da fatura e atualiza o saldo.'
      operationId: recordPayment
      security:
      - HTTPBearer: []
      parameters:
      - name: invoice_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Invoice Id
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 100
          - type: 'null'
          description: Opcional; com a chave, repetir o pagamento devolve a resposta
            original.
          title: Idempotency-Key
        description: Opcional; com a chave, repetir o pagamento devolve a resposta
          original.
      - name: X-Correlation-ID
        in: header
        required: false
        description: UUID de correlação. A API gera um UUID quando o cabeçalho é omitido.
        schema:
          type: string
          format: uuid
        example: 11111111-1111-4111-8111-111111111111
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentInput'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResultResponse'
          headers:
            Idempotency-Replayed:
              description: Retorna true quando a API reutiliza a resposta ou o pagamento
                já registrado.
              schema:
                type: string
                enum:
                - 'true'
                - 'false'
        '401':
          description: Token ausente ou inválido.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: urn:archcorp:problem:unauthorized
                title: Não autenticado
                status: 401
                detail: Token ausente ou inválido
                instance: /api/v1/finance/invoices/{invoice_id}/payments
                code: UNAUTHORIZED
                correlationId: 11111111-1111-4111-8111-111111111111
        '403':
          description: Papel sem permissão para a operação.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: urn:archcorp:problem:forbidden
                title: Acesso negado
                status: 403
                detail: Papel sem permissão para esta operação
                instance: /api/v1/finance/invoices/{invoice_id}/payments
                code: FORBIDDEN
                correlationId: 11111111-1111-4111-8111-111111111111
        '404':
          description: Fatura não encontrada.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: urn:archcorp:problem:not-found
                title: Recurso não encontrado
                status: 404
                detail: Fatura não encontrada
                instance: /api/v1/finance/invoices/{invoice_id}/payments
                code: NOT_FOUND
                correlationId: 11111111-1111-4111-8111-111111111111
        '409':
          description: Referência ou Idempotency-Key já usada com outro pagamento,
            valor acima do saldo, fatura quitada ou cancelada.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                overpayment:
                  summary: Valor acima do saldo
                  value:
                    type: urn:archcorp:problem:conflict
                    title: Conflito
                    status: 409
                    detail: Pagamento excede saldo da fatura
                    instance: /api/v1/finance/invoices/ffffffff-ffff-4fff-8fff-ffffffffffff/payments
                    code: CONFLICT
                    correlationId: 11111111-1111-4111-8111-111111111111
                paid:
                  summary: Fatura quitada
                  value:
                    type: urn:archcorp:problem:conflict
                    title: Conflito
                    status: 409
                    detail: Fatura já quitada
                    instance: /api/v1/finance/invoices/ffffffff-ffff-4fff-8fff-ffffffffffff/payments
                    code: CONFLICT
                    correlationId: 11111111-1111-4111-8111-111111111111
                cancelled:
                  summary: Fatura cancelada
                  value:
                    type: urn:archcorp:problem:invalid-state
                    title: Conflito
                    status: 409
                    detail: Fatura cancelada não recebe pagamento
                    instance: /api/v1/finance/invoices/ffffffff-ffff-4fff-8fff-ffffffffffff/payments
                    code: INVALID_STATE
                    correlationId: 11111111-1111-4111-8111-111111111111
                idempotency:
                  summary: Chave reutilizada
                  value:
                    type: urn:archcorp:problem:idempotency-conflict
                    title: Conflito
                    status: 409
                    detail: Idempotency-Key já utilizada com outro pagamento
                    instance: /api/v1/finance/invoices/ffffffff-ffff-4fff-8fff-ffffffffffff/payments
                    code: IDEMPOTENCY_CONFLICT
                    correlationId: 11111111-1111-4111-8111-111111111111
        '422':
          description: Entrada inválida ou moeda diferente da fatura.
          content:
            application/problem+json:
              schema:
