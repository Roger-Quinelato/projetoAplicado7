asyncapi: 3.0.0
info:
  title: Eventos Localiza Cenário 4
  version: 1.0.0
  description: >-
    Contratos de eventos da outbox. O protótipo executa consumidores internos no
    despacho e pode publicar uma cópia no RabbitMQ local, na exchange topic
    `archcorp.events`, com routing key igual ao `eventType`. O protótipo não
    consome do broker; as operações `receive` descrevem os consumidores internos
    chamados pelo despachante, cada um com deduplicação por `eventId` na inbox.
servers:
  localRabbitMQ:
    host: rabbitmq:5672
    protocol: amqp
channels:
  contractActivated:
    address: ContractActivated.v1
    bindings:
      $ref: '#/components/channelBindings/archcorpEvents'
    messages:
      contractActivated:
        $ref: '#/components/messages/ContractActivated'
  ticketOpened:
    address: TicketOpened.v1
    bindings:
      $ref: '#/components/channelBindings/archcorpEvents'
    messages:
      ticketOpened:
        $ref: '#/components/messages/TicketOpened'
  customerUpdated:
    address: CustomerUpdated.v1
    bindings:
      $ref: '#/components/channelBindings/archcorpEvents'
    messages:
      customerUpdated:
        $ref: '#/components/messages/CustomerUpdated'
  ticketEntitlementReconciled:
    address: TicketEntitlementReconciled.v1
    bindings:
      $ref: '#/components/channelBindings/archcorpEvents'
    messages:
      ticketEntitlementReconciled:
        $ref: '#/components/messages/TicketEntitlementReconciled'
  ticketResolved:
    address: TicketResolved.v1
    bindings:
      $ref: '#/components/channelBindings/archcorpEvents'
    messages:
      ticketResolved:
        $ref: '#/components/messages/TicketResolved'
operations:
  publishContractActivated:
    action: send
    summary: 'Publicado pelo contexto `contracts` na outbox transacional.'
    channel:
      $ref: '#/channels/contractActivated'
  receiveContractActivated:
    action: receive
    summary: 'Consumidores: `finance` (primeira fatura) e `workflow-preparacao-retirada` (processo ONBOARDING).'
    channel:
      $ref: '#/channels/contractActivated'
  publishTicketOpened:
    action: send
    summary: 'Publicado pelo contexto `support` na outbox transacional.'
    channel:
      $ref: '#/channels/ticketOpened'
  receiveTicketOpened:
    action: receive
    summary: 'Consumidor: `workflow-ticket-resolution` (processo TICKET_RESOLUTION).'
    channel:
      $ref: '#/channels/ticketOpened'
  publishCustomerUpdated:
    action: send
    summary: 'Publicado pelo contexto `crm` na outbox transacional.'
    channel:
      $ref: '#/channels/customerUpdated'
  receiveCustomerUpdated:
    action: receive
    summary: 'Consumidor: `contracts-customer-projection` (projeção de nome e e-mail nos contratos).'
    channel:
      $ref: '#/channels/customerUpdated'
  publishTicketEntitlementReconciled:
    action: send
    summary: 'Publicado pelo contexto `support` na outbox transacional.'
    channel:
      $ref: '#/channels/ticketEntitlementReconciled'
  receiveTicketEntitlementReconciled:
    action: receive
    summary: 'Consumidor: `workflow-ticket-entitlement` (ajuste de prazo ou cancelamento do processo).'
    channel:
      $ref: '#/channels/ticketEntitlementReconciled'
  publishTicketResolved:
    action: send
    summary: 'Publicado pelo contexto `support` na outbox transacional.'
    channel:
      $ref: '#/channels/ticketResolved'
  receiveTicketResolved:
    action: receive
    summary: 'Consumidor: `workflow-ticket-resolution-complete` (conclusão do processo e das tarefas).'
    channel:
      $ref: '#/channels/ticketResolved'
components:
  channelBindings:
    archcorpEvents:
      amqp:
        is: routingKey
        exchange:
          name: archcorp.events
          type: topic
          durable: true
          autoDelete: false
          vhost: /
        bindingVersion: 0.3.0
  messageBindings:
    persistentJson:
      amqp:
        contentEncoding: utf-8
        messageType: event
        bindingVersion: 0.3.0
  messages:
    ContractActivated:
      name: ContractActivated.v1
      title: Contrato ativado
      contentType: application/json
      bindings:
        $ref: '#/components/messageBindings/persistentJson'
      payload:
        allOf:
          - $ref: '#/components/schemas/EventEnvelope'
          - type: object
            properties:
              eventType: { const: ContractActivated.v1 }
              producer: { const: contracts }
              payload: { $ref: '#/components/schemas/ContractActivatedPayload' }
      examples:
        - name: contractActivated
          summary: Contrato ativado para faturamento e preparação de retirada
          payload:
            eventId: cccccccc-cccc-4ccc-8ccc-cccccccccccc
            eventType: ContractActivated.v1
            eventVersion: 1
            occurredAt: '2026-10-01T10:00:00Z'
            correlationId: 11111111-1111-4111-8111-111111111111
            causationId: null
            producer: contracts
            payload:
              contractId: bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb
              customerId: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa
              serviceCode: RENTAL-FLEX
              startsOn: '2026-10-01'
              billing:
                amount: 2500.00
                currency: BRL
                cycle: MONTHLY
              slaHours: 8
              status: ACTIVE
    TicketOpened:
      name: TicketOpened.v1
      title: Chamado aberto
      contentType: application/json
      bindings:
        $ref: '#/components/messageBindings/persistentJson'
      payload:
        allOf:
          - $ref: '#/components/schemas/EventEnvelope'
          - type: object
            properties:
              eventType: { const: TicketOpened.v1 }
              producer: { const: support }
              payload: { $ref: '#/components/schemas/TicketOpenedPayload' }
      examples:
        - name: ticketOpened
          summary: Chamado elegível encaminhado para resolução
          payload:
            eventId: eeeeeeee-eeee-4eee-8eee-eeeeeeeeeeee
            eventType: TicketOpened.v1
            eventVersion: 1
            occurredAt: '2026-10-01T10:10:00Z'
            correlationId: 11111111-1111-4111-8111-111111111111
            causationId: null
            producer: support
            payload:
              ticketId: dddddddd-dddd-4ddd-8ddd-dddddddddddd
              customerId: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa
              contractId: bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb
              serviceCode: RENTAL-FLEX
              category: OUTAGE
              status: OPEN
              priority: HIGH
              slaHours: 8
              dueAt: '2026-10-01T18:10:00Z'
    CustomerUpdated:
      name: CustomerUpdated.v1
      title: Cliente atualizado
      contentType: application/json
      bindings:
        $ref: '#/components/messageBindings/persistentJson'
      payload:
        allOf:
          - $ref: '#/components/schemas/EventEnvelope'
          - type: object
            properties:
              eventType: { const: CustomerUpdated.v1 }
              producer: { const: crm }
              payload: { $ref: '#/components/schemas/CustomerUpdatedPayload' }
      examples:
        - name: customerUpdated
          summary: Cadastro do CRM propagado para a projeção de Contracts
          payload:
            eventId: ffffffff-ffff-4fff-8fff-ffffffffffff
            eventType: CustomerUpdated.v1
            eventVersion: 1
            occurredAt: '2026-10-01T09:50:00Z'
            correlationId: 11111111-1111-4111-8111-111111111111
            causationId: null
            producer: crm
            payload:
              customerId: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa
              name: Cliente Frota Localiza Ltda.
              email: gestor.frota@cliente-sintetico.example.com
    TicketEntitlementReconciled:
      name: TicketEntitlementReconciled.v1
      title: Elegibilidade do chamado reconciliada
      contentType: application/json
      bindings:
        $ref: '#/components/messageBindings/persistentJson'
      payload:
        allOf:
          - $ref: '#/components/schemas/EventEnvelope'
          - type: object
            properties:
              eventType: { const: TicketEntitlementReconciled.v1 }
              producer: { const: support }
              payload: { $ref: '#/components/schemas/TicketStatusPayload' }
      examples:
        - name: ticketEntitlementReconciled
          summary: Chamado pendente reconciliado após Contracts voltar a responder
          payload:
            eventId: aaaaaaaa-1111-4111-8111-aaaaaaaaaaaa
            eventType: TicketEntitlementReconciled.v1
            eventVersion: 1
            occurredAt: '2026-10-01T10:10:00Z'
            correlationId: 11111111-1111-4111-8111-111111111111
            causationId: null
            producer: support
            payload:
              ticketId: dddddddd-dddd-4ddd-8ddd-dddddddddddd
              customerId: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa
              contractId: bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb
              serviceCode: RENTAL-FLEX
              category: QUESTION
              status: OPEN
              priority: NORMAL
              slaHours: 8
              dueAt: '2026-10-01T18:10:00Z'
    TicketResolved:
      name: TicketResolved.v1
      title: Chamado resolvido
      contentType: application/json
      bindings:
        $ref: '#/components/messageBindings/persistentJson'
      payload:
        allOf:
          - $ref: '#/components/schemas/EventEnvelope'
          - type: object
            properties:
              eventType: { const: TicketResolved.v1 }
              producer: { const: support }
              payload: { $ref: '#/components/schemas/TicketStatusPayload' }
      examples:
        - name: ticketResolved
          summary: Chamado resolvido encerra o processo de resolução
          payload:
            eventId: aaaaaaaa-2222-4222-8222-aaaaaaaaaaaa
            eventType: TicketResolved.v1
            eventVersion: 1
            occurredAt: '2026-10-01T12:10:00Z'
            correlationId: 11111111-1111-4111-8111-111111111111
            causationId: null
            producer: support
            payload:
              ticketId: dddddddd-dddd-4ddd-8ddd-dddddddddddd
              customerId: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa
              contractId: bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb
              serviceCode: RENTAL-FLEX
              category: OUTAGE
              status: RESOLVED
              priority: HIGH
              slaHours: 8
              dueAt: '2026-10-01T18:10:00Z'
  schemas:
    EventEnvelope:
      type: object
      required: [eventId, eventType, eventVersion, occurredAt, correlationId, causationId, producer, payload]
      properties:
        eventId: { type: string, format: uuid }
        eventType: { type: string }
        eventVersion: { type: integer, const: 1 }
        occurredAt: { type: string, format: date-time }
        correlationId: { type: string, format: uuid }
        causationId: { type: [string, 'null'], format: uuid }
        producer: { type: string }
        payload: { type: object }
    Money:
      type: object
      required: [amount, currency, cycle]
      properties:
        amount: { type: number, multipleOf: 0.01, exclusiveMinimum: 0 }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        cycle: { type: string, enum: [ONCE, MONTHLY, QUARTERLY, YEARLY] }
    ContractActivatedPayload:
      type: object
      required: [contractId, customerId, serviceCode, startsOn, billing, slaHours, status]
      properties:
        contractId: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        serviceCode: { type: string }
        startsOn: { type: string, format: date }
        billing: { $ref: '#/components/schemas/Money' }
        slaHours: { type: integer, minimum: 1 }
        status: { const: ACTIVE }
    TicketOpenedPayload:
      type: object
      required: [ticketId, customerId, contractId, serviceCode, category, status, priority]
      properties:
        ticketId: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        contractId: { type: string, format: uuid }
        serviceCode: { type: string }
        category: { type: string }
        status: { type: string, enum: [OPEN, PENDING_ENTITLEMENT] }
        priority: { type: string, enum: [NORMAL, HIGH] }
        slaHours: { type: [integer, 'null'] }
        dueAt: { type: [string, 'null'], format: date-time }
    CustomerUpdatedPayload:
      type: object
      required: [customerId, name, email]
      properties:
        customerId: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
    TicketStatusPayload:
      type: object
      required: [ticketId, customerId, contractId, serviceCode, category, status, priority]
      properties:
        ticketId: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        contractId: { type: string, format: uuid }
        serviceCode: { type: string }
        category: { type: string }
        status: { type: string, enum: [OPEN, PENDING_ENTITLEMENT, REJECTED_ENTITLEMENT, RESOLVED] }
        priority: { type: string, enum: [NORMAL, HIGH] }
        slaHours: { type: [integer, 'null'] }
        dueAt: { type: [string, 'null'], format: date-time }
