<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1480" viewBox="0 0 1600 1480" role="img" aria-labelledby="title desc">
<title id="title">Arquitetura do módulo de Reservas e Contratos</title>
<desc id="desc">Diagrama da entrada pela API, núcleo central de Contracts, consulta ao CRM, gerenciamento de dados no PostgreSQL e publicação de eventos para Finance, Workflow e RabbitMQ.</desc>
<defs>
