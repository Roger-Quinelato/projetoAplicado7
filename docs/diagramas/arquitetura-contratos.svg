  <linearGradient id="navy" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#132b4a"/><stop offset="1" stop-color="#21466f"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#18324f" flood-opacity=".11"/></filter>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#637c98"/></marker>
  <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5 0 10z" fill="#8760c5"/></marker>
  <style>
    text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
    .eyebrow{font-size:14px;font-weight:800;letter-spacing:1.7px}
    .head{font-size:23px;font-weight:750}
    .label{font-size:18px;font-weight:720}
    .body{font-size:15px;font-weight:500}
    .small{font-size:13px;font-weight:550}
    .flow{font-size:13px;font-weight:700;fill:#516982}
    .pill{font-size:12px;font-weight:800;letter-spacing:.7px}
  </style>
</defs>
