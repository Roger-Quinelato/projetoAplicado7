name: Verify

on:
  push:
    branches: [main, sobe-artefatos-cenario-4]
  pull_request:

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Test API and integration flows
        run: PYTHONPATH=src python -m pytest -q tests -p no:cacheprovider
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install frontend dependencies
        working-directory: web
        run: npm ci
      - name: Build frontend
        working-directory: web
        run: npm run build
      - name: Build deployable Docker image
        run: docker build -t archcorp-demo .
