name: Verify

on:
  push:
    branches: [main, sobe-artefatos-cenario-4]
  pull_request:

permissions:
  contents: read

jobs:
  postgresql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: archcorp
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: archcorp_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U archcorp -d archcorp_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://archcorp:synthetic-ci-only@localhost:5432/archcorp_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Test real locks, migration convergence and integrated flows
        run: PYTHONPATH=src python -m pytest -q tests -p no:cacheprovider
  rabbitmq:
    runs-on: ubuntu-latest
    services:
      rabbitmq:
        image: rabbitmq:3.13-alpine
        ports: ['5672:5672']
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_RABBITMQ_URL: amqp://guest:guest@localhost:5672/%2F
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Test broker confirms against real RabbitMQ
        run: PYTHONPATH=src python -m pytest -q tests/test_rabbitmq_real.py tests/test_reliability_regressions.py -p no:cacheprovider -rs
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Audit Python dependencies
        run: python -m pip_audit -r requirements.txt
      - name: Validate project skill pack
        run: python tools/perfil_skills.py --check
      - name: Test coordinated agent flow with fake agents
        run: python -m pytest -q tests_agentes -p no:cacheprovider
      - name: Test API and integration flows
        run: PYTHONPATH=src python -m pytest -q tests -p no:cacheprovider
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install frontend dependencies
        working-directory: web
        run: npm ci
      - name: Audit frontend dependencies
        working-directory: web
        run: npm audit --audit-level=moderate
      - name: Test frontend
        working-directory: web
        run: npm test
      - name: Build frontend
        working-directory: web
        run: npm run build
      - name: Build deployable Docker image
        run: docker build -t archcorp-demo .
