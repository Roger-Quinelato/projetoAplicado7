[importlinter]
root_packages =
    archcorp
include_external_packages = True

[importlinter:contract:contracts-sem-internos-sinteticos]
name = Contracts sem internos de crm e integration (sintético)
type = forbidden
source_modules =
    archcorp.contracts
forbidden_modules =
    archcorp.crm.models
    archcorp.crm.service
    archcorp.integration.models
    archcorp.integration.service
allow_indirect_imports = True

[importlinter:contract:dominio-sem-sqlalchemy-sintetico]
name = Domain sem sqlalchemy (sintético)
type = forbidden
source_modules =
    archcorp.contracts.domain
forbidden_modules =
    sqlalchemy
allow_indirect_imports = False

[importlinter:contract:main-sem-models-sintetico]
name = main sem models de contexto (sintético)
type = forbidden
source_modules =
    archcorp.main
forbidden_modules =
    archcorp.contracts.models
    archcorp.integration.models
    archcorp.crm.models
allow_indirect_imports = True
