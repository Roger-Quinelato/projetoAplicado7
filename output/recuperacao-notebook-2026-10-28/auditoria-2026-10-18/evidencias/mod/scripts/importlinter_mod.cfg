[importlinter:contract:dominios-puros]
name = Domínios (domain.py) sem framework, persistência, infraestrutura ou contexto
type = forbidden
source_modules =
    archcorp.contracts.domain
    archcorp.finance.domain
    archcorp.support.domain
forbidden_modules =
    fastapi
    starlette
    sqlalchemy
    pika
    pydantic
    alembic
    archcorp.infrastructure
    archcorp.integration
    archcorp.observability
    archcorp.security
    archcorp.errors
allow_indirect_imports = False

