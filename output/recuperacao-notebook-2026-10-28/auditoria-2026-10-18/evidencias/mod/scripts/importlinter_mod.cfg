[importlinter]
root_packages =
    archcorp
include_external_packages = True

# Contextos de negócio: só a fachada `public` de outro contexto (e integration.public) é permitida.
# allow_indirect_imports = True: a checagem vale para importação direta, como o teste atual.

[importlinter:contract:crm-sem-internos-de-outros-contextos]
name = CRM não importa internos de outros contextos
type = forbidden
source_modules =
    archcorp.crm
forbidden_modules =
    archcorp.contracts.models
    archcorp.contracts.service
    archcorp.contracts.routes
    archcorp.contracts.schemas
    archcorp.contracts.domain
    archcorp.contracts.adapters
    archcorp.finance.models
    archcorp.finance.service
    archcorp.finance.routes
    archcorp.finance.domain
    archcorp.support.models
    archcorp.support.service
    archcorp.support.routes
    archcorp.support.schemas
    archcorp.support.domain
    archcorp.workflow.models
    archcorp.workflow.service
    archcorp.workflow.routes
    archcorp.integration.models
    archcorp.integration.service
    archcorp.integration.routes
    archcorp.integration.schemas
allow_indirect_imports = True

